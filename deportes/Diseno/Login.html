    <style>

            background: rgba(26, 26, 26, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-glow:focus {
            border-color: #b9f63f;
            box-shadow: 0 0 0 1px #b9f63f;
        }

        .btn-glow:hover {
            box-shadow: 0 0 15px rgba(185, 246, 63, 0.4);
            transform: translateY(-1px);
        }
    </style>

<body
    class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-primary-fixed selection:text-on-primary-fixed relative">
    <!-- Background Atmospheric Image -->
    <div class="absolute inset-0 z-0">
        <div class="absolute inset-0 bg-cover bg-center opacity-30"
            data-alt="A dramatic, high-contrast photograph of an empty, professional artificial turf football pitch at night. The scene is illuminated by intense, harsh stadium floodlights cutting through a light mist. The aesthetic is gritty, technical, and highly competitive, utilizing deep charcoal shadows and electric lime green accents to convey high-energy sports action in a modern, professional setting."
            style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCOb3XyN9wnqIP-s3tgvWzqYJq9r7sotYly7VbxlAZlfzcEmxVruRvC69UbLMPXl8ZtYBBoOL8jln5oI1t91eiYPwtBlVLoxKxtNai_BEmQQQ3hl_gzp5YzFj5KDyMBJeiWTlybXGeFa-jJJLiqoiiHeUK7aeKdSstQx7vZb7-5_CxclpnybSShxJNAMYxcH3AuvbBL_ZdRMbPsjp4LJTwyUB6cRdFJ03zKCdbOX5XnzTwnKbDOiG1i')">
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-background via-background/80 to-transparent"></div>
    </div>
    <!-- Main Content Container -->
    <main class="flex-grow flex items-center justify-center p-container-margin z-10 relative">
        <!-- Login Card -->
        <div class="glass-panel w-full max-w-md rounded-xl p-stack-md flex flex-col gap-stack-lg shadow-2xl">
            <!-- Header Section -->
            <div class="text-center flex flex-col gap-base">
                <h1 class="font-display-lg text-display-lg text-primary-fixed uppercase tracking-tighter">DEPORTES</h1>
                <p class="text-on-surface-variant font-body-md text-body-md">Acceso Administrativo</p>
            </div>
            <!-- Login Form -->
            <form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault(); validateForm();">
                <!-- Input Group: DPI -->
                <div class="flex flex-col gap-base">
                    <label class="font-label-sm text-label-sm text-on-surface uppercase" for="dpi">Documento de
                        Identificación (DPI)</label>
                    <div class="relative">
                        <span
                            class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant"
                            style="font-variation-settings: 'FILL' 0;">badge</span>
                        <input
                            class="w-full bg-[#1A1A1A] text-on-surface border-0 border-b border-white/10 rounded-t-DEFAULT pl-10 pr-3 py-3 focus:ring-0 input-glow transition-all duration-200 outline-none font-body-md"
                            id="dpi" maxlength="13" name="dpi" pattern="\d{13}" placeholder="13 dígitos numéricos"
                            type="text" />
                    </div>
                    <!-- Error Message Placeholder (Hidden by default) -->
                    <p class="hidden text-error text-sm mt-1 flex items-center gap-1" id="dpi-error">
                        <span class="material-symbols-outlined text-[16px]">error</span>
                        DPI inválido. Ingrese 13 números.
                    </p>
                </div>
                <!-- Input Group: Password -->
                <div class="flex flex-col gap-base">
                    <div class="flex justify-between items-baseline">
                        <label class="font-label-sm text-label-sm text-on-surface uppercase"
                            for="password">Contraseña</label>
                        <a class="font-label-sm text-label-sm text-primary-fixed hover:text-white transition-colors"
                            href="#">¿Olvidó su contraseña?</a>
                    </div>
                    <div class="relative">
                        <span
                            class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant"
                            style="font-variation-settings: 'FILL' 0;">lock</span>
                        <input
                            class="w-full bg-[#1A1A1A] text-on-surface border-0 border-b border-white/10 rounded-t-DEFAULT pl-10 pr-10 py-3 focus:ring-0 input-glow transition-all duration-200 outline-none font-body-md"
                            id="password" name="password" placeholder="••••••••" type="password" />
                        <button
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary-fixed transition-colors"
                            onclick="togglePassword()" type="button">
                            <span class="material-symbols-outlined" id="visibility-icon"
                                style="font-variation-settings: 'FILL' 0;">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- Actions -->
                <div class="pt-2">
                    <button
                        class="w-full bg-primary-fixed text-on-primary-fixed font-title-md text-title-md py-3 rounded-DEFAULT transition-all duration-200 btn-glow uppercase flex items-center justify-center gap-2"
                        type="submit">
                        Ingresar
                        <span class="material-symbols-outlined">arrow_forward</span>
                    </button>
                </div>
            </form>
            <!-- Support Footer -->
            <div class="text-center mt-auto pt-stack-sm border-t border-white/5">
                <p class="text-on-surface-variant font-label-sm text-label-sm">
                    ¿Problemas para acceder? <a class="text-primary-fixed hover:underline" href="#">Contactar Soporte
                        Técnico</a>
                </p>
            </div>
        </div>
    </main>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }

        function validateForm() {
            const dpiInput = document.getElementById('dpi');
            const dpiError = document.getElementById('dpi-error');
            const dpiValue = dpiInput.value.replace(/\s/g, '');

            // Simple validation: strictly 13 digits
            const isValid = /^\d{13}$/.test(dpiValue);

            if (!isValid) {
                dpiInput.classList.add('border-error');
                dpiInput.classList.replace('focus:border-primary-fixed', 'focus:border-error');
                dpiError.classList.remove('hidden');

                // Shake animation for error
                dpiInput.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], {
                    duration: 400,
                    easing: 'ease-in-out'
                });
            } else {
                dpiInput.classList.remove('border-error');
                dpiInput.classList.replace('focus:border-error', 'focus:border-primary-fixed');
                dpiError.classList.add('hidden');

                // Proceed with login logic here (e.g., show a loading state)
                const submitBtn = document.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Verificando...';
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

                setTimeout(() => {
                    submitBtn.innerHTML = originalText;
                    submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                    // Alert just for demo purposes
                    // alert('Login successful'); 
                }, 1500);
            }
        }
    </script>
</body>
