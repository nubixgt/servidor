<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ingreso · Sistema VISAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>
:root{
  --navy:#0B2B63;--blue:#155EEF;--text:#102A56;--text-2:#4f6690;--danger:#d92d20;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  min-height:100vh;min-height:100dvh;
  font-family:'Inter',system-ui,sans-serif;color:var(--text);
  background:#dfeaf7 url('fondo.png') no-repeat center center/cover;
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));
}
.login-shell{width:100%;max-width:1200px;display:flex;justify-content:flex-start;padding-left:clamp(0px,24vw,340px)}
.login-card{
  width:100%;max-width:440px;
  padding:36px 38px 30px;border-radius:26px;
  background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.38));
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 30px 70px rgba(11,43,99,.22),inset 0 1px 0 rgba(255,255,255,.8);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.logo{display:block;width:230px;max-width:80%;margin:0 auto 34px}
h1{font-family:'Sora',sans-serif;font-size:30px;line-height:1.15;color:#0d2a55;letter-spacing:-.01em}
.lead{font-size:14px;line-height:1.55;color:var(--text-2);margin:10px 0 28px}
label{display:block;font-size:13px;font-weight:700;color:#0d2a55;margin-bottom:8px}
.field{position:relative;margin-bottom:20px}
.field svg.ico{position:absolute;left:18px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:#58709a;pointer-events:none}
.field input{
  width:100%;height:54px;padding:0 52px 0 50px;border-radius:14px;
  font:inherit;font-size:15px;color:var(--text);
  background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.9);
  box-shadow:inset 0 1px 2px rgba(11,43,99,.06);
  outline:none;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}
.field input::placeholder{color:#7d91b3}
.field input:focus{background:rgba(255,255,255,.9);border-color:#7aa7f5;box-shadow:0 0 0 4px rgba(21,94,239,.14)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:#58709a;cursor:pointer;display:grid;place-items:center}
.eye:hover{background:rgba(21,94,239,.08)}
.eye:focus-visible,.submit:focus-visible{outline:2px solid #2077ed;outline-offset:2px}
.eye svg{width:20px;height:20px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.error{min-height:20px;font-size:13px;font-weight:600;color:var(--danger);margin:-6px 0 10px}
.submit{
  width:100%;height:56px;border:0;border-radius:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  font:inherit;font-size:15px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,#1570ef,#0b3c8f);
  box-shadow:0 12px 26px rgba(21,94,239,.32);
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
}
.submit:hover{transform:translateY(-1px);box-shadow:0 16px 30px rgba(21,94,239,.38)}
.submit:active{transform:translateY(0) scale(.99)}
.submit:disabled{filter:saturate(.6);cursor:wait;transform:none}
.submit svg{width:18px;height:18px;transition:transform .15s ease}
.submit:hover svg{transform:translateX(3px)}
.foot{margin-top:22px;text-align:center;font-size:11.5px;color:#4f6690}
@media(max-width:900px){.login-shell{padding-left:0;justify-content:center}}
@media(max-width:480px){.login-card{padding:28px 22px 24px;border-radius:22px}h1{font-size:26px}.logo{margin-bottom:26px}}
@media(prefers-reduced-motion:reduce){.login-card{animation:none}.submit,.submit svg{transition:none}}
</style>
</head>
<body>
<main class="login-shell">
  <form class="login-card" id="login-form" novalidate>
    <img class="logo" src="maga-logo.png" alt="Ministerio de Agricultura, Ganadería y Alimentación">
    <h1>¡Bienvenido!</h1>
    <p class="lead">Ingresa a tu cuenta para consultar el Sistema de Información VISAN.</p>

    <label for="usuario">Usuario</label>
    <div class="field">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      <input id="usuario" name="usuario" type="text" placeholder="Tu usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>

    <label for="password">Contraseña</label>
    <div class="field">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      <input id="password" name="password" type="password" placeholder="Tu contraseña" autocomplete="current-password" required>
      <button type="button" class="eye" id="eye" aria-label="Mostrar contraseña" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="error" id="error" role="alert" aria-live="assertive"></div>

    <button type="submit" class="submit" id="submit">
      <span>Ingresar al sistema</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <p class="foot">Sistema de Información VISAN · DAAN / MAGA</p>
  </form>
</main>
<script>
(function () {
  const form = document.getElementById('login-form');
  const user = document.getElementById('usuario');
  const pass = document.getElementById('password');
  const err = document.getElementById('error');
  const btn = document.getElementById('submit');
  const eye = document.getElementById('eye');

  // Si ya hay sesión, ir directo al tablero
  fetch('api/auth.php?a=me', { credentials: 'same-origin' }).then(r => { if (r.ok) location.replace('index.html'); }).catch(() => {});

  eye.addEventListener('click', () => {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', String(show));
    eye.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    if (!user.value.trim() || !pass.value) {
      err.textContent = 'Ingresa tu usuario y contraseña.';
      (user.value.trim() ? pass : user).focus();
      return;
    }
    btn.disabled = true;
    btn.querySelector('span').textContent = 'Ingresando…';
    try {
      const res = await fetch('api/auth.php?a=login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-VISAN': '1' },
        body: JSON.stringify({ usuario: user.value.trim(), password: pass.value })
      });
      const data = await res.json().catch(() => ({ ok: false, error: `Error del servidor (${res.status}).` }));
      if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo iniciar sesión.');
      location.replace('index.html');
    } catch (e2) {
      err.textContent = e2.message === 'Failed to fetch' ? 'No hay conexión con el servidor.' : e2.message;
      pass.select();
      btn.disabled = false;
      btn.querySelector('span').textContent = 'Ingresar al sistema';
    }
  });
  user.focus();
})();
</script>
</body>
</html>
