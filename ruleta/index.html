  .bg::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse 80% 55% at 50% 8%, rgba(255,229,168,.16), transparent 60%);
  }
  .page{
    position:relative;
    z-index:1;
    max-width:1180px;
    margin:0 auto;
    padding:clamp(20px,4vw,48px) clamp(16px,4vw,40px) 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header{
    text-align:center;
    margin-bottom:clamp(18px,3vw,30px);
  }
  .brandmark{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:.14em;
    color:var(--gold-light);
    background:rgba(8,26,52,.55);
    border:1px solid rgba(217,166,53,.4);
    padding:7px 16px 7px 12px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .brandmark .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 8px 2px rgba(217,166,53,.7);
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(34px,5.4vw,60px);
    line-height:1.04;
    margin:0 0 14px;
    color:var(--cream);
    text-shadow:0 4px 24px rgba(0,0,0,.35);
  }
  h1 em{
    font-style:italic;
    color:var(--gold-light);
  }
  .sub{
    max-width:520px;
    margin:0 auto;
    font-size:clamp(14.5px,1.7vw,17px);
    line-height:1.55;
    color:rgba(246,239,220,.82);
    font-weight:500;
  }
  .sub strong{ color:var(--gold-light); font-weight:700; }

  /* ---------- WHEEL ---------- */
  .wheel-stage{
    position:relative;
    margin:clamp(20px,4vw,36px) 0 clamp(30px,4vw,44px);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .wheel-wrap{
    position:relative;
    width:min(72vw,440px);
    height:min(72vw,440px);
  }
  .pointer{
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:16px solid transparent;
    border-right:16px solid transparent;
    border-top:28px solid var(--gold);
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.45));
    z-index:5;
  }
  .pointer::after{
    content:"";
    position:absolute;
    top:-27px; left:-9px;
    width:18px;height:18px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 70%);
    box-shadow:0 2px 5px rgba(0,0,0,.4);
  }
  .wheel-ring{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold-light), var(--gold), #a9791f, var(--gold), var(--gold-light));
    box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.15);
    z-index:0;
  }
  .wheel{
    position:absolute;
    inset:8px;
    border-radius:50%;
    background:conic-gradient(from -36deg,
      var(--fucsia) 0deg 72deg,
      var(--rojo) 72deg 144deg,
      var(--blanco) 144deg 216deg,
      var(--azul) 216deg 288deg,
      var(--negro) 288deg 360deg);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.18), inset 0 0 30px rgba(0,0,0,.35);
    transition:transform 4.6s cubic-bezier(.11,.7,.1,1);
    z-index:1;
    will-change:transform;
  }
  .wheel::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:repeating-conic-gradient(from -36deg, transparent 0deg 70.3deg, rgba(255,255,255,.55) 70.3deg 72deg);
    mix-blend-mode:overlay;
    pointer-events:none;
  }
  .wedge{
    position:absolute;
    top:50%; left:50%;
    width:88px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:6px;
  }
  .wedge .thumb{
    width:56px;height:56px;
    border-radius:50%;
    object-fit:cover;
    border:2.5px solid rgba(255,255,255,.85);
    box-shadow:0 3px 9px rgba(0,0,0,.4);
  }
  .wedge .wname{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:11.5px;
    letter-spacing:.05em;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.55);
    background:rgba(0,0,0,.22);
    padding:2px 8px;
    border-radius:999px;
  }
  .hub{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:clamp(92px,17vw,112px);
    height:clamp(92px,17vw,112px);
    border-radius:50%;
    z-index:6;
    border:3px solid var(--gold-light);
    background:radial-gradient(circle at 32% 28%, #ffe9b0, var(--gold) 55%, #a9791f 100%);
    box-shadow:0 10px 22px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.5);
    color:var(--ink);
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(14px,2.2vw,17px);
    letter-spacing:.02em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    line-height:1.15;
    padding:6px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .hub:hover:not(:disabled){ transform:translate(-50%,-50%) scale(1.04); }
  .hub:active:not(:disabled){ transform:translate(-50%,-50%) scale(.97); }
  .hub:disabled{
    cursor:default;
    filter:grayscale(.35) brightness(.92);
  }
  .round-tag{
    margin-top:18px;
    font-size:13px;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--gold-light);
    background:rgba(8,26,52,.5);
    border:1px solid rgba(217,166,53,.35);
    padding:6px 16px;
    border-radius:999px;
  }

  footer{
    margin-top:34px;
    text-align:center;
  }
  .reset-link{
    background:none;border:none;
    color:rgba(246,239,220,.55);
    font-family:'Manrope',sans-serif;
    font-size:12.5px;
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    padding:6px;
  }
  .reset-link:hover{ color:var(--gold-light); }

  /* ---------- OVERLAY / REVEAL ---------- */
  .overlay{
    position:fixed; inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(5,14,28,.78);
    backdrop-filter:blur(6px);
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
    padding:20px;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .confetti-layer{
    position:absolute; inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:2;
  }
  .confetti-piece{
    position:absolute;
    top:-20px;
    will-change:transform, opacity;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    85%{ opacity:1; }
    100%{ transform:translateY(112vh) rotate(600deg); opacity:0; }
  }
  .reveal-rays{
    position:absolute;
    top:50%; left:50%;
    width:min(160vw,1100px);
    height:min(160vw,1100px);
    transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,
      rgba(242,206,124,.16) 0deg 6deg,
      transparent 6deg 18deg);
    animation:raySpin 26s linear infinite;
    mix-blend-mode:screen;
    pointer-events:none;
    z-index:1;
  }
  @keyframes raySpin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }
  .reveal-flash{
    position:fixed; inset:0;
    background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.95), rgba(255,229,168,.45) 38%, transparent 70%);
    opacity:0;
    pointer-events:none;
    z-index:4;
  }
  .reveal-flash.pop{ animation:flashPop .7s ease-out; }
  @keyframes flashPop{ 0%{opacity:0;} 12%{opacity:1;} 100%{opacity:0;} }
  .reveal-card{
    position:relative;
    z-index:3;
    width:min(94vw,420px);
    background:linear-gradient(180deg, #143a68, #081a34);
    border:1px solid rgba(217,166,53,.55);
    border-radius:28px;
    padding:30px 26px 28px;
    text-align:center;
    box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04) inset;
    transform:scale(.85) translateY(18px);
    opacity:0;
    transition:transform .45s cubic-bezier(.2,.8,.2,1), opacity .4s ease;
  }
  .overlay.show .reveal-card{
    transform:scale(1) translateY(0);
    opacity:1;
  }
  .reveal-kicker{
    font-size:12.5px;
    font-weight:800;
    letter-spacing:.16em;
    color:var(--gold-light);
    margin-bottom:16px;
  }
  .reveal-photo-frame{
    position:relative;
    width:min(72vw,300px);
    aspect-ratio:3/4;
    margin:0 auto 22px;
    border-radius:20px;
    overflow:hidden;
    background:#081a34;
    box-shadow:
      0 0 0 3px rgba(8,26,52,1),
      0 0 0 6px var(--gold-light),
      0 0 0 8px rgba(217,166,53,.35),
      0 25px 55px rgba(0,0,0,.55);
  }
  .reveal-photo-frame::before{
    content:"";
    position:absolute;
    inset:-30%;
    background:radial-gradient(circle, rgba(242,206,124,.55), transparent 65%);
    filter:blur(18px);
    opacity:.55;
    animation:glowPulse 2.4s ease-in-out infinite;
    z-index:0;
  }
  @keyframes glowPulse{
    0%,100%{ opacity:.35; transform:scale(.94); }
    50%{ opacity:.65; transform:scale(1.04); }
  }
  .reveal-img{
    position:relative;
    z-index:1;
    width:100%; height:100%;
    object-fit:cover;
    filter:blur(22px) saturate(1.1);
    transform:scale(1.18);
    transition:filter .7s ease, transform .7s ease;
  }
  .reveal-card.revealed .reveal-img{
    filter:blur(0) saturate(1.1);
    transform:scale(1);
  }
  .reveal-suspense{
    position:absolute; inset:0;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    background:linear-gradient(165deg, rgba(19,55,98,.85), rgba(6,17,36,.9));
    transition:opacity .5s ease, visibility .5s;
  }
  .reveal-card.revealed .reveal-suspense{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .pulse-ring{
    position:absolute;
    width:70px; height:70px;
    border-radius:50%;
    border:2px solid var(--gold-light);
    opacity:0;
    animation:pulseRing 1.8s ease-out infinite;
  }
  .pulse-ring.delay{ animation-delay:.9s; }
  @keyframes pulseRing{
    0%{ transform:scale(.5); opacity:.9; }
    100%{ transform:scale(2.6); opacity:0; }
  }
  .suspense-text{
    position:relative;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.18em;
    color:var(--gold-light);
  }
  .reveal-name{
    font-family:'Fraunces',serif;
    font-weight:800;
    font-size:clamp(32px,7vw,42px);
    color:#fff;
    margin:0 0 26px;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease .15s, transform .5s ease .15s;
    text-shadow:0 0 24px rgba(242,206,124,.45);
  }
  .reveal-card.revealed .reveal-name{ opacity:1; transform:translateY(0); }
  .reveal-btn{
    background:var(--gold);
    color:var(--ink);
    border:none;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:14px;
    padding:13px 32px;
    border-radius:999px;
    cursor:pointer;
    opacity:0;
    transform:translateY(8px);
    transition:transform .15s ease, background .2s ease, opacity .5s ease .4s;
    pointer-events:none;
  }
  .reveal-card.revealed .reveal-btn{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .reveal-btn:hover{ background:var(--gold-light); transform:translateY(-1px); }
  .reveal-btn:active{ transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .wheel{ transition:transform .8s ease; }
    .confetti-piece{ animation-duration:.01s !important; }
  }
</style>
</head>

];

const wheel = document.getElementById('wheel');
const hub = document.getElementById('hub');
const overlay = document.getElementById('overlay');
const revealImg = document.getElementById('revealImg');
const revealName = document.getElementById('revealName');
const revealKicker = document.getElementById('revealKicker');
const revealBtn = document.getElementById('revealBtn');
const revealCard = document.getElementById('revealCard');
const revealFlash = document.getElementById('revealFlash');
const roundTag = document.getElementById('roundTag');
const confettiLayer = document.getElementById('confettiLayer');
const resetBtn = document.getElementById('resetBtn');

let currentRound = 0;
let currentRotation = 0;
let spinning = false;

function buildWheel(){
  wheel.innerHTML = '';
  const Rpercent = 35; // distance from center as % of wheel width/height
  PRIZES.forEach((p, i) => {
    const angle = i * 72; // degrees, clockwise from top
    const rad = angle * Math.PI / 180;
    const xPct = 50 + Rpercent * Math.sin(rad);
    const yPct = 50 - Rpercent * Math.cos(rad);
    const wedge = document.createElement('div');
    wedge.className = 'wedge';
    wedge.style.left = xPct + '%';
    wedge.style.top = yPct + '%';
    wedge.style.transform = `translate(-50%,-50%) rotate(${-angle}deg)`;
    wedge.innerHTML = `<img class="thumb" src="${p.thumb}" alt="${p.label}"><span class="wname">${p.label}</span>`;
    wheel.appendChild(wedge);
  });
}

function updateRoundTag(){
  if(currentRound >= PRIZES.length){
    roundTag.textContent = 'Sorteo completo — 5 de 5 premios entregados';
    hub.textContent = 'Completo';
    hub.disabled = true;
    return;
  }
  roundTag.textContent = `Ronda ${currentRound+1} de ${PRIZES.length}`;
}

function launchConfetti(){
  const colors = ['#d9a635','#f2ce7c','#efe7d4','#c92a7c','#1f5fae','#b8283a'];
  const count = 130;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 6 + Math.random()*7;
    const isCircle = Math.random() > .5;
    el.style.left = Math.random()*100 + '%';
    el.style.width = size + 'px';
    el.style.height = (isCircle ? size : size*1.7) + 'px';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.borderRadius = isCircle ? '50%' : '2px';
    el.style.animationDuration = (2.4 + Math.random()*1.8) + 's';
    el.style.animationDelay = (Math.random()*.3) + 's';
    confettiLayer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

function spin(){
  if(spinning || currentRound >= PRIZES.length) return;
  spinning = true;
  hub.disabled = true;
  hub.textContent = '···';

  const targetIndex = currentRound;
  const targetCenterAngle = targetIndex * 72;
  const jitter = (Math.random() * 30) - 15;
  const desiredMod = (( -targetCenterAngle + jitter ) % 360 + 360) % 360;
  const currentMod = ((currentRotation % 360) + 360) % 360;
  let delta = desiredMod - currentMod;
  delta = ((delta % 360) + 360) % 360;
  const fullSpins = 6 + Math.floor(Math.random()*3);
  currentRotation += fullSpins*360 + delta;

  wheel.style.transform = `rotate(${currentRotation}deg)`;

  const onEnd = () => {
    wheel.removeEventListener('transitionend', onEnd);
    revealWinner(targetIndex);
  };
  wheel.addEventListener('transitionend', onEnd);
}

function revealWinner(index){
  const p = PRIZES[index];
  const isLast = index === PRIZES.length - 1;

  revealCard.classList.remove('revealed');
  revealKicker.textContent = `RONDA ${index+1} DE ${PRIZES.length}`;
  revealImg.src = p.big;
  revealImg.alt = p.label;
  revealName.textContent = p.label;
  revealBtn.textContent = isLast ? 'Finalizar sorteo' : 'Siguiente ronda';

  overlay.classList.add('show');

  window.setTimeout(() => {
    revealCard.classList.add('revealed');
    revealFlash.classList.remove('pop');
    void revealFlash.offsetWidth; // restart animation
    revealFlash.classList.add('pop');
    launchConfetti();
  }, 1300);
}

revealBtn.addEventListener('click', () => {
  overlay.classList.remove('show');
  spinning = false;
  currentRound += 1;
  updateRoundTag();
  if(currentRound < PRIZES.length){
    hub.disabled = false;
    hub.textContent = 'GIRAR';
  }
});

hub.addEventListener('click', spin);

resetBtn.addEventListener('click', () => {
  currentRound = 0;
  currentRotation = 0;
  spinning = false;
  wheel.style.transition = 'none';
  wheel.style.transform = 'rotate(0deg)';
  requestAnimationFrame(() => {
    wheel.style.transition = 'transform 4.6s cubic-bezier(.11,.7,.1,1)';
  });
  hub.disabled = false;
  hub.textContent = 'GIRAR';
  updateRoundTag();
});

buildWheel();
updateRoundTag();
</script>
