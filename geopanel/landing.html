<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPanel — Municipalidad de Sanarate, El Progreso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ══ TOP NAV ══════════════════════════════════════════════════ -->
<nav class="topbar">
    <button class="nav-btn btn-panel-toggle" id="navPanelToggle" title="Mostrar/ocultar panel">
        <span class="btn-icon">☰</span>
    </button>
    <div class="topbar-brand" onclick="history.back()" style="cursor:pointer" title="Volver">
        <div>
            <div class="brand-name">GeoPanel Boletas</div>
            <div class="brand-sub">Municipalidad de Sanarate, El Progreso</div>
        </div>
    </div>
    <div class="topbar-right">
        <button class="nav-btn btn-export" id="exportBtn">
            <span class="btn-icon">📄</span> PDF
        </button>
    </div>
</nav>

<!-- ══ LOADING BAR ══════════════════════════════════════════════ -->
<div class="loading-bar" id="loadingBar">
    <div class="loading-progress"></div>
    <div class="loading-text" id="loadingText">⏳ Cargando boletas...</div>
</div>

<!-- ══ 2-COLUMN LAYOUT ══════════════════════════════════════════ -->
<div class="app-layout">

    <!-- COL 1 — Panel izquierdo -->
    <aside class="left-panel" id="leftPanel">
        <button class="panel-toggle" id="lpToggle" title="Comprimir panel">‹</button>

        <!-- MAPA BASE -->
        <div class="lp-block basemap-block">
            <div class="block-head">
                <span class="block-title">🗺 Mapa base</span>
                <button class="btn-collapse-panel" id="lpToggle2" title="Ocultar panel">‹ Ocultar</button>
            </div>
            <div class="basemap-btns">
                <button class="bm-btn active" data-bm="hibrido"><span class="bm-icon">🌍</span>Híbrido</button>
                <button class="bm-btn" data-bm="satellite"><span class="bm-icon">🛰️</span>Satélite</button>
                <button class="bm-btn" data-bm="topo"><span class="bm-icon">⛰️</span>Topográfico</button>
                <button class="bm-btn" data-bm="calor"><span class="bm-icon">🌡️</span>Calor</button>
            </div>
        </div>

        <!-- LISTADO -->
        <div class="lp-block listado-block">
            <div class="listado-header">
                <span class="block-title">📋 Listado</span>
                <span class="listado-count" id="listCount">0</span>
            </div>
            <div class="listado-search">
                <span>🔍</span>
                <input type="text" id="listSearch" placeholder="Filtrar…" autocomplete="off">
                <button id="listSearchClear">✕</button>
            </div>
            <div class="listado-tabs">
                <button class="rp-tab active" data-tab="all">
                    Todas <span class="rp-badge" id="tabAll">0</span>
                </button>
                <button class="rp-tab" data-tab="nocoord">
                    Sin Coord. <span class="rp-badge red" id="tabNocoord">0</span>
                </button>
                <button class="rp-tab" data-tab="pending">
                    Pendientes <span class="rp-badge orange" id="tabPending">0</span>
                </button>
            </div>
            <div class="listado-scroll" id="boletaList">
                <div class="list-empty">
                    <div class="empty-ico">📂</div>
                    <p>Cargando boletas…</p>
                </div>
            </div>
        </div>

        <!-- FILTROS — estilo tienda, secciones comprimibles -->
        <div class="lp-block filters-block">
            <div class="block-head">
                <span class="block-title">⚙️ Filtros</span>
                <button class="btn-reset-filters" id="resetFilters">↺ Limpiar</button>
            </div>
            <div class="filters-scroll" id="dynamicFilters">
                <div class="filter-placeholder">Los filtros aparecen al cargar los datos</div>
            </div>
        </div>

    </aside>

    <!-- COL 2 — Mapa -->
    <main class="map-col">
        <div id="map"></div>

        <div class="map-btns">
            <button class="map-btn" id="fitBoundsBtn" title="Centrar mapa">⊡ Centrar</button>
        </div>

        <div class="map-legend">
            <div class="ml-title">Tipos de boleta</div>
            <div class="ml-row"><span class="ml-em">🍎</span>Víveres / Alimentos</div>
            <div class="ml-row"><span class="ml-em">💉</span>Jornada médica</div>
            <div class="ml-row"><span class="ml-em">🏠</span>Láminas</div>
            <div class="ml-row"><span class="ml-em">📍</span>Otro / sin tipo</div>
        </div>

        <div class="map-infobar" id="mapInfobar">Cargando datos…</div>
    </main>

</div><!-- /app-layout -->

<!-- PANEL BACKDROP -->
<div class="panel-backdrop" id="panelBackdrop"></div>

<!-- PANEL DETALLE -->
<div class="detail-panel" id="bottomPanel">
    <div class="detail-header">
        <div class="detail-title" id="bottomPanelTitle">📋 Detalle</div>
        <button class="detail-close" id="bottomPanelClose">✕</button>
    </div>
    <div class="detail-body" id="bottomPanelContent"></div>
</div>
<div class="detail-overlay" id="bottomPanelOverlay"></div>

<!-- MODAL IMAGEN -->
<div class="image-modal" id="imageModal">
    <button class="img-modal-close" id="modalClose">✕</button>
    <div class="img-modal-inner">
        <button class="img-nav" id="imgPrev">‹</button>
        <img id="modalImage" src="" alt="Imagen ampliada">
        <button class="img-nav" id="imgNext">›</button>
    </div>
    <div class="img-counter" id="imgCounter"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
