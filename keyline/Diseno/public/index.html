<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Keyline GT · Suelo y Agua para el Futuro</title>
<meta name="theme-color" content="#0b3d2e" />
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/chartjs/chart.umd.min.js"></script>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Fondo decorativo: curvas keyline -->
  <div class="bg-keyline" aria-hidden="true">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="kl1" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%" stop-color="#0f5132" />
          <stop offset="100%" stop-color="#0b3d1f" />
        </linearGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#kl1)" />
      <g stroke="rgba(255,255,255,0.055)" stroke-width="2" fill="none">
        <path d="M-100 780 C 300 700, 500 830, 900 720 S 1500 620, 1750 700" />
        <path d="M-100 700 C 300 620, 520 750, 920 640 S 1500 540, 1750 620" />
        <path d="M-100 620 C 300 540, 540 670, 940 560 S 1500 460, 1750 540" />
        <path d="M-100 540 C 300 460, 560 590, 960 480 S 1500 380, 1750 460" />
        <path d="M-100 460 C 300 380, 580 510, 980 400 S 1500 300, 1750 380" />
        <path d="M-100 380 C 300 300, 600 430, 1000 320 S 1500 220, 1750 300" />
      </g>
    </svg>
  </div>

  <!-- ============ LOGIN ============ -->
  <div id="viewLogin" class="auth-screen">
    <div class="auth-card glass">
      <div class="auth-brand">
        <div class="brand-mark">
          <svg viewBox="0 0 48 48" width="34" height="34">
            <defs><linearGradient id="gradAuth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7be495"/><stop offset="1" stop-color="#0f8a45"/></linearGradient></defs>
            <path d="M6 30 Q18 10 42 14 Q26 20 22 40 Q16 26 6 30Z" fill="url(#gradAuth)"/>
            <path d="M44 8 Q34 6 28 16 Q36 16 40 24 Q46 16 44 8Z" fill="#32b9e8" opacity=".9"/>
          </svg>
        </div>
        <div>
          <h1>Keyline<span>GT</span></h1>
          <p>Suelo y agua para el futuro</p>
        </div>
      </div>
      <form id="loginForm">
        <div class="field">
          <label>Correo electrónico</label>
          <input type="email" id="loginEmail" required placeholder="tucorreo@keyline.gt" autocomplete="username" />
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div id="loginError" class="form-error" hidden></div>
        <button type="submit" class="btn btn-primary btn-block">Ingresar al sistema</button>
      </form>
      <div class="auth-foot">
        <span>Sistema de monitoreo de parcelas Keyline · Guatemala</span>
      </div>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="viewApp" class="app-shell" hidden>
    <aside class="sidebar glass">
      <div class="sidebar-top">
        <div class="brand-mark small">
          <svg viewBox="0 0 48 48" width="28" height="28">
            <defs><linearGradient id="gradSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7be495"/><stop offset="1" stop-color="#0f8a45"/></linearGradient></defs>
            <path d="M6 30 Q18 10 42 14 Q26 20 22 40 Q16 26 6 30Z" fill="url(#gradSide)"/>
            <path d="M44 8 Q34 6 28 16 Q36 16 40 24 Q46 16 44 8Z" fill="#32b9e8" opacity=".9"/>
          </svg>
          <span>Keyline<b>GT</b></span>
        </div>
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Contraer / expandir menú">«</button>
      </div>

      <nav id="navMenu" class="nav-menu"></nav>

      <div class="sidebar-user">
        <div class="user-avatar" id="userAvatar">--</div>
        <div class="user-meta">
          <strong id="userName">—</strong>
          <span id="userRole">—</span>
        </div>
      </div>
      <button class="btn btn-ghost btn-block" id="logoutBtn"><span class="label">Cerrar sesión</span></button>
    </aside>

    <main class="main-area">
      <header class="topbar glass">
        <div class="topbar-left">
          <div class="topbar-title">
            <h2 id="pageTitle">Panel</h2>
            <p id="pageSubtitle">—</p>
          </div>
        </div>
        <label class="topbar-search">
          <span class="ic">🔍</span>
          <input type="text" id="globalSearch" placeholder="Buscar parcelas, técnicos, departamentos..." />
        </label>
        <div class="topbar-actions">
          <span class="country-chip">🇬🇹 Guatemala</span>
          <button class="topbar-icon-btn" id="notifBtn" title="Notificaciones">🔔<span class="dot" id="notifDot" hidden></span></button>
          <div id="topbarActions" style="display:flex; gap:10px;"></div>
        </div>
      </header>

      <div class="view-container" id="viewContainer"></div>
    </main>
  </div>

  <!-- Modal genérico (foto ampliada, confirmaciones, etc.) -->
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="/js/api.js"></script>
  <script src="/js/constants-cache.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/view-tecnico.js"></script>
  <script src="/js/view-dashboard.js"></script>
  <script src="/js/view-parcelas.js"></script>
  <script src="/js/view-usuarios.js"></script>
  <script src="/js/view-bioindicadores.js"></script>
  <script src="/js/view-variables.js"></script>
  <script src="/js/view-reportes.js"></script>
  <script src="/js/view-configuracion.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
