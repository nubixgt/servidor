# Sistema PAM · despliegue en un servidor Linux con Docker Engine + Docker Compose v2
#   cp .env.example .env   (y edite las claves)
#   docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pam}
      POSTGRES_USER: ${POSTGRES_USER:-pam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      TZ: America/Guatemala
    command: >
      postgres -c shared_buffers=${PG_SHARED_BUFFERS:-2GB} -c effective_cache_size=${PG_CACHE:-6GB}
               -c work_mem=64MB -c maintenance_work_mem=1GB -c max_wal_size=4GB
               -c random_page_cost=1.1 -c max_connections=100 -c log_min_duration_statement=2000
               -c timezone=America/Guatemala
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    networks: [interna]

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    image: pam-backend:1.0
    restart: unless-stopped
    command: ["api"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pam}
      TZ: America/Guatemala
    volumes:
      - datos:/data
    depends_on:
      db: { condition: service_healthy }
    networks: [interna]

  worker:
    image: pam-backend:1.0
    restart: unless-stopped
    command: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pam}
      TZ: America/Guatemala
    volumes:
      - datos:/data
    depends_on:
      api: { condition: service_started }
    networks: [interna]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/pam.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
    depends_on: [api]
    networks: [interna]

  respaldo:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-pam}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-pam}
      RETENCION_DIAS: ${RETENCION_DIAS:-30}
      HORA_RESPALDO: ${HORA_RESPALDO:-01}
      TZ: America/Guatemala
    volumes:
      - ${BACKUP_DIR:-./respaldos}:/respaldos
      - ./deploy/backup/respaldo.sh:/respaldo.sh:ro
      - ./deploy/backup/restaurar.sh:/restaurar.sh:ro
    entrypoint: ["/bin/sh", "/respaldo.sh", "programado"]
    depends_on:
      db: { condition: service_healthy }
    networks: [interna]

volumes:
  pgdata:
  datos:

networks:
  interna:
