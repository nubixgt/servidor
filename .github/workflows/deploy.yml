name: 🚀 Deploy m.nubix.gt

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install & Build Frontend (sigie)
        run: |
          cd sigie/Frontend
          npm install
          npm run build

      - name: 📦 Install & Build Frontend (VisarSistema)
        run: |
          cd VisarSistema/Frontend
          npm install
          npm run build

      - name: 📦 Install & Build Frontend (CDATA)
        run: |
          cd CDATA/Frontend
          npm install
          npm run build

      - name: 📦 Install & Build Frontend (EleccionCYD)
        run: |
          cd EleccionCYD/Frontend
          npm install
          npm run build

      - name: 📦 Install & Build Frontend (sistemas-web)
        run: |
          cd sistemas-web/Frontend
          npm install
          npm run build

      - name: 📦 Install & Build Frontend (VisarListadoSolicitudes)
        run: |
          cd VisarListadoSolicitudes
          npm install
          npm run build

      - name: 📦 Install & Build Frontend (CONADEA)
        run: |
          cd CONADEA/Frontend
          npm install
          npm run build

      - name: 📦 Install & Build Frontend (InteligenciaTerritorial)
        run: |
          cd InteligenciaTerritorial/Frontend
          npm install
          npm run build

      - name: 📦 Install & Build Frontend (unificacion_maga)
        run: |
          cd unificacion_maga/Frontend
          npm install
          npm run build

      - name: 📦 Install & Build Frontend (deportes)
        run: |
          cd deportes/Frontend
          npm install
          npm run build


      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude '**/uploads/' \
            --exclude '**/Uploads/' \
            --exclude '**/node_modules/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '**/whatsapp-bot/.htaccess' \
            --exclude '**/whatsapp-bot/session/' \
            --chmod=D755,F644 \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}

      # Publica automáticamente el build (dist/) de CADA proyecto en la raíz de su
      # carpeta en el servidor. Detecta tanto el patrón "Proyecto/Frontend/dist"
      # (el que usan casi todos los proyectos) como "Proyecto/dist" (el caso de
      # VisarListadoSolicitudes, que no tiene subcarpeta Frontend/).
      #
      # Al ser dinámico, un proyecto NUEVO no necesita ningún cambio aquí: basta
      # con agregarle su paso de "npm install && npm run build" arriba y este
      # paso lo publica solo, sin volver a tocar este archivo.
      - name: 📂 Publicar builds de Frontend en la raíz de cada proyecto
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH%/}/"
            cd "$DEPLOY_PATH"
            for dist_dir in */Frontend/dist */dist; do
              [ -f "$dist_dir/index.html" ] || continue
              parent_dir=$(dirname "$dist_dir")
              if [ "$(basename "$parent_dir")" = "Frontend" ]; then
                app_dir=$(dirname "$parent_dir")
              else
                app_dir="$parent_dir"
              fi
              echo "Publicando $dist_dir -> $app_dir/"
              cp -R "$dist_dir/." "$app_dir/"
            done
          '